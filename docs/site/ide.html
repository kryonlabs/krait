<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Krait Web IDE</title>
  <meta name="description" content="Open Kryon examples by URL in the Krait web IDE shell.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="ide-page">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-label="Krait">K</span>
        <span>KRAIT</span>
      </a>
      <nav class="header-nav" aria-label="Primary">
        <a href="index.html#features">Features</a>
        <a href="index.html#preview">Live preview</a>
        <a href="https://kryonlabs.com/ide.html">Kryon IDE ↗</a>
        <a class="btn btn-primary" href="ide.html">Web IDE</a>
      </nav>
    </div>
  </header>

  <main class="krait-web-ide">
    <aside class="session-sidebar">
      <p class="section-eyebrow">Krait Web IDE</p>
      <h1>Example Sessions</h1>
      <p>Open a Kryon source URL as a browser session. The embedded preview is powered by Kryon’s web compiler and KRB renderer path.</p>
      <form class="source-form" data-source-form>
        <label for="source-url">Source URL</label>
        <input id="source-url" name="src" type="url" data-source-url>
        <button class="btn btn-primary" type="submit">Open</button>
      </form>
      <div class="example-list" data-examples></div>
    </aside>
    <section class="session-frame-wrap">
      <iframe title="Kryon Web IDE session" data-session-frame></iframe>
    </section>
  </main>

  <script src="ide.js"></script>
</body>
</html>
