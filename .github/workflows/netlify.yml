name: Netlify

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-submodule-urls:
    name: Submodule URLs are public HTTPS
    runs-on: ubuntu-latest
    steps:
      # Plain checkout on purpose: the guard must not depend on fetching
      # the submodules it validates (an SSH URL would break that fetch).
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reject non-HTTPS submodule URLs
        run: |
          set -eu
          if [ ! -f .gitmodules ]; then echo "no submodules - ok"; exit 0; fi
          bad=$(grep -nE '^[[:space:]]*url[[:space:]]*=' .gitmodules \
              | grep -vE '^[0-9]+:[[:space:]]*url[[:space:]]*=[[:space:]]*https://' || true)
          if [ -n "$bad" ]; then
            echo "::error::Non-HTTPS submodule URL(s) break fresh clones and CI:$bad"
            exit 1
          fi
          echo "all submodule URLs HTTPS - ok"

  build:
    name: Build Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build Site
        run: |
          set -euo pipefail
          make docs-site
          test -f build/site/index.html
          test -f build/site/ide.html
          test -f build/site/ide.js

      - name: Upload Site Artifact
        uses: actions/upload-artifact@v4
        with:
          name: krait-site
          path: build/site
          if-no-files-found: error

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    steps:
      - name: Download Site Artifact
        uses: actions/download-artifact@v4
        with:
          name: krait-site
          path: build/site

      - name: Install Netlify CLI
        run: npm install --global netlify-cli

      - name: Deploy Preview To Netlify
        run: |
          set -euo pipefail
          auth_token="$(printf '%s' "$NETLIFY_AUTH_TOKEN" | tr -d '\r\n')"
          site_id="$(printf '%s' "$NETLIFY_SITE_ID" | tr -d '\r\n')"
          test -n "$auth_token" || { echo "::notice::NETLIFY_AUTH_TOKEN is empty or missing; skipping Netlify deploy"; exit 0; }
          test -n "$site_id" || { echo "::notice::NETLIFY_SITE_ID is empty or missing; skipping Netlify deploy"; exit 0; }
          netlify deploy \
            --no-build \
            --dir build/site \
            --alias "pr-${{ github.event.pull_request.number }}" \
            --message "Preview ${{ github.event.pull_request.number }}" \
            --auth "$auth_token" \
            --site "$site_id"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'

    steps:
      - name: Download Site Artifact
        uses: actions/download-artifact@v4
        with:
          name: krait-site
          path: build/site

      - name: Install Netlify CLI
        run: npm install --global netlify-cli

      - name: Deploy Production To Netlify
        run: |
          set -euo pipefail
          auth_token="$(printf '%s' "$NETLIFY_AUTH_TOKEN" | tr -d '\r\n')"
          site_id="$(printf '%s' "$NETLIFY_SITE_ID" | tr -d '\r\n')"
          test -n "$auth_token" || { echo "::notice::NETLIFY_AUTH_TOKEN is empty or missing; skipping Netlify deploy"; exit 0; }
          test -n "$site_id" || { echo "::notice::NETLIFY_SITE_ID is empty or missing; skipping Netlify deploy"; exit 0; }
          netlify deploy \
            --no-build \
            --dir build/site \
            --prod \
            --message "Production ${{ github.sha }}" \
            --auth "$auth_token" \
            --site "$site_id"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
